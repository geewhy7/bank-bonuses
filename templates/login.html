<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Bank Bonuses</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;color:#222;background:#fff;max-width:360px;margin:4rem auto;padding:0 1rem;line-height:1.45}
  h1{font-size:1.1rem;margin-bottom:1rem}
  input[type=password]{width:100%;box-sizing:border-box;padding:.55rem .65rem;font-size:1rem;border:1px solid #ccc;border-radius:4px;margin-bottom:.75rem}
  button{width:100%;padding:.6rem;font-size:1rem;background:#222;color:#fff;border:none;border-radius:4px;cursor:pointer}
  button:hover{background:#000}
  .error{color:#b00020;font-size:.85rem;margin-bottom:.75rem}
  a{color:#666;font-size:.85rem}
</style>
</head>
<body>
<h1>Admin login</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
  <input type="password" name="password" placeholder="Password" autofocus>
  <button type="submit">Log in</button>
</form>
<p><a href="{{ url_for('index') }}">&larr; back to the list</a></p>
</body>
</html>
